<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>العد التنازلي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 500;
    color: #8b949e;
    letter-spacing: 0.02em;
  }
  .date {
    font-size: 1rem;
    color: #6e7681;
  }
  .countdown {
    display: flex;
    gap: 1.5rem;
    direction: rtl;
  }
  .unit {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1.2rem 1.6rem;
    min-width: 110px;
  }
  .value {
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #58a6ff;
    line-height: 1.1;
  }
  .label {
    margin-top: 0.4rem;
    font-size: 0.95rem;
    color: #8b949e;
  }
  #done {
    display: none;
    font-size: 1.6rem;
    color: #3fb950;
  }
</style>
</head>
<body>
  <h1>العد التنازلي</h1>

  <div class="countdown" id="countdown">
    <div class="unit">
      <div class="value" id="days">٠</div>
      <div class="label">يوم</div>
    </div>
    <div class="unit">
      <div class="value" id="hours">٠</div>
      <div class="label">ساعة</div>
    </div>
    <div class="unit">
      <div class="value" id="minutes">٠</div>
      <div class="label">دقيقة</div>
    </div>
    <div class="unit">
      <div class="value" id="seconds">٠</div>
      <div class="label">ثانية</div>
    </div>
  </div>

  <div class="date">حتى ١٠ يناير ٢٠٢٧</div>
  <div id="done">وصل التاريخ</div>

<script>
  // الهدف: 10 يناير 2027، منتصف الليل بتوقيت القاهرة (UTC+2 في يناير)
  var target = new Date('2027-01-10T00:00:00+02:00').getTime();

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function toArabicDigits(s) {
    return String(s).replace(/[0-9]/g, function (d) {
      return '٠١٢٣٤٥٦٧٨٩'[d];
    });
  }

  function tick() {
    var now = Date.now();
    var diff = target - now;

    if (diff <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      return;
    }

    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    var seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById('days').textContent = toArabicDigits(days);
    document.getElementById('hours').textContent = toArabicDigits(pad2(hours));
    document.getElementById('minutes').textContent = toArabicDigits(pad2(minutes));
    document.getElementById('seconds').textContent = toArabicDigits(pad2(seconds));
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
