<title>العد التنازلي</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    text-align: center;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 500;
    color: #8b949e;
    letter-spacing: 0.02em;
  }
  .date {
    font-size: 1rem;
    color: #6e7681;
  }
  .rows {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    align-items: center;
  }
  .countdown-row {
    display: flex;
    gap: 1.5rem;
    direction: rtl;
    justify-content: center;
    flex-wrap: wrap;
  }
  .unit {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
    padding: 1.2rem 1.6rem;
    min-width: 110px;
  }
  .value {
    font-size: 3rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #58a6ff;
    line-height: 1.1;
  }
  .label {
    margin-top: 0.4rem;
    font-size: 0.95rem;
    color: #8b949e;
  }
  #done {
    display: none;
    font-size: 1.6rem;
    color: #3fb950;
  }
</style>
</head>
<body>
  <h1>العد التنازلي</h1>

  <div class="rows" id="countdown">
    <div class="countdown-row">
      <div class="unit">
        <div class="value" id="d1">٠</div>
        <div class="label">يوم</div>
      </div>
      <div class="unit">
        <div class="value" id="h1">٠٠</div>
        <div class="label">ساعة</div>
      </div>
      <div class="unit">
        <div class="value" id="m1">٠٠</div>
        <div class="label">دقيقة</div>
      </div>
      <div class="unit">
        <div class="value" id="s1">٠٠</div>
        <div class="label">ثانية</div>
      </div>
    </div>
    <div class="countdown-row">
      <div class="unit">
        <div class="value" id="h2">٠</div>
        <div class="label">ساعة</div>
      </div>
      <div class="unit">
        <div class="value" id="m2">٠٠</div>
        <div class="label">دقيقة</div>
      </div>
      <div class="unit">
        <div class="value" id="s2">٠٠</div>
        <div class="label">ثانية</div>
      </div>
    </div>
    <div class="countdown-row">
      <div class="unit">
        <div class="value" id="m3">٠</div>
        <div class="label">دقيقة</div>
      </div>
      <div class="unit">
        <div class="value" id="s3">٠٠</div>
        <div class="label">ثانية</div>
      </div>
    </div>
    <div class="countdown-row">
      <div class="unit">
        <div class="value" id="s4">٠</div>
        <div class="label">ثانية</div>
      </div>
    </div>
  </div>

  <div class="date">حتى ١ مارس ٢٠٢٨</div>
  <div id="done">وصل التاريخ</div>

<script>
  // الهدف: 1 مارس 2028، منتصف الليل بتوقيت القاهرة (UTC+2 في مارس)
  var target = new Date('2028-03-01T00:00:00+02:00').getTime();

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function toArabicDigits(s) {
    return String(s).replace(/[0-9]/g, function (d) {
      return '٠١٢٣٤٥٦٧٨٩'[d];
    });
  }

  function set(id, v) {
    document.getElementById(id).textContent = toArabicDigits(v);
  }

  function tick() {
    var now = Date.now();
    var diff = target - now;

    if (diff <= 0) {
      document.getElementById('countdown').style.display = 'none';
      document.getElementById('done').style.display = 'block';
      return;
    }

    var seconds = Math.floor((diff % 60000) / 1000);
    var minutes = Math.floor((diff % 3600000) / 60000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var days = Math.floor(diff / 86400000);

    // السطر الأول: أيام / ساعات / دقائق / ثواني
    set('d1', days);
    set('h1', pad2(hours));
    set('m1', pad2(minutes));
    set('s1', pad2(seconds));

    // السطر الثاني: إجمالي الساعات / دقائق / ثواني
    set('h2', Math.floor(diff / 3600000));
    set('m2', pad2(minutes));
    set('s2', pad2(seconds));

    // السطر الثالث: إجمالي الدقائق / ثواني
    set('m3', Math.floor(diff / 60000));
    set('s3', pad2(seconds));

    // السطر الرابع: إجمالي الثواني
    set('s4', Math.floor(diff / 1000));
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
